services:
  db:
      image: postgres:15-alpine
      container_name: mortgage-db
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 1234
        POSTGRES_DB: TestDB
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data 
  api:
    image: mortgage-api
    build:
      context: .
      dockerfile: MortgageComparerAPI/Dockerfile
    container_name: mortgage-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnectionString=Host=db;Port=5432;Database=${DB_Name};Username=${DB_User};Password=${DB_Password}
      - Jwt__Key=${JWT_KEY}
      - Jwt__SecretKey=${JWT_SECRET_KEY}

  app:
    image: mortgage-app
    build:
      context: .
      dockerfile: MortgageComparer/Dockerfile
    container_name: mortgage-app
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://api:8080
      - ConnectionStrings__DefaultConnectionString=Host=db;Port=5432;Database=${DB_Name};Username=${DB_User};Password=${DB_Password}
      - Jwt__Key=${JWT_KEY}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - api

  frontend:
    image: mortgage-frontend
    build:
      context: ./Frontend/frontend
      dockerfile: Dockerfile
    container_name: mortgage-frontend
    ports:
      - "3000:80"
    depends_on:
      - app
volumes:
  pgdata: