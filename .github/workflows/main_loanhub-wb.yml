name: Build and deploy - Multiple Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: 'Release'
  OUTPUT_PATH: "${{ github.workspace }}/publish"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # 1. Publikujemy pierwszy projekt (np. API) do głównego folderu
      - name: Build and Publish MortgageComparer (Project 1)
        run: |
          # Budujemy i publikujemy pierwszy projekt do osobnego folderu temp
          dotnet publish MortgageComparer/MortgageComparer.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp/backend1"

      - name: Build and Publish MortgageComparerAPI (Project 2)
        run: |
          # Budujemy i publikujemy drugi projekt do osobnego folderu temp
          dotnet publish MortgageComparerAPI/MortgageComparerAPI.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp/backend2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build React (Vite)
        working-directory: ./Frontend/frontend
        run: |
          npm install
          npm run build

      - name: Finalize Artifact Structure
        run: |
          # Tworzymy folder wwwroot wewnątrz GŁÓWNEGO projektu (zakładam, że to API)
          New-Item -ItemType Directory -Force -Path "${{env.DOTNET_ROOT}}/myapp/backend2/wwwroot"
          
          # Kopiujemy build Reacta do wwwroot drugiego projektu
          Copy-Item -Path "./Frontend/frontend/dist/*" -Destination "${{env.DOTNET_ROOT}}/myapp/backend2/wwwroot" -Recurse -Force

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: full-app-package
          path: ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40E8FE9BDDA94D08851377F114A4EF95 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC03E7EBCEB5465DB48F3535C191126B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A704669530E4BEF84DB526FF2D2A327 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'loanHub-wb'
          package: ./publish


